# Mises à jour proposées une fois par mois, regroupées pour limiter le bruit : chaque proposition passe par la CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      mineures-et-correctifs:
        update-types: [minor, patch]
    ignore:
      # Les types de Node suivent la version de Node utilisée (22), pas la dernière parue.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
