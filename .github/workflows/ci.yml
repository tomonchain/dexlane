name: CI

# Chaîne de livraison :
#   push sur une branche de travail (claude/**) → vérifications sur le résultat fusionné avec main
#   → pull request ouverte au besoin, puis fusionnée → Vercel déploie la production depuis main
#   → si la version du package.json est nouvelle, étiquette vX.Y.Z et release GitHub (CHANGELOG.md).
# Les autres pull requests (dont Dependabot) sont vérifiées ; les mises à jour mineures se fusionnent seules.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# Un nouveau push rend l'exécution précédente inutile ; sur main, chaque commit va au bout.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Lecture seule par défaut ; seules les tâches de fusion demandent davantage, explicitement.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Base jetable du conteneur ci-dessous ; les tests créent leurs propres bases « …_test » et les vident.
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/dexlane_test

jobs:
  checks:
    name: Types et tests
    # Une branche de travail est vérifiée par son push : inutile de la revérifier via sa pull request.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Ce qui sera en production est la branche fusionnée avec main : c'est cela qu'on vérifie.
      - name: Intégrer main
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git fetch origin main
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" merge --no-edit origin/main
      # La version de pnpm est celle du champ packageManager, la même qu'en local et sur Vercel.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Vérifier les types
        run: pnpm typecheck
      - name: Tests unitaires et d'intégration
        run: pnpm test

  e2e:
    name: Parcours navigateur
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Intégrer main
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git fetch origin main
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" merge --no-edit origin/main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Installer le navigateur de test
        run: pnpm --filter @dexlane/web exec playwright install --with-deps chromium
      # Construit l'application comme en production, puis déroule les parcours contre une vraie base.
      - name: Parcours de bout en bout
        run: pnpm e2e
      - name: Conserver les traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-resultats
          path: apps/web/test-results
          retention-days: 7

  deliver:
    name: Livraison
    # Une branche de travail entièrement verte part en production : pull request, fusion, puis déploiement par Vercel.
    needs: [checks, e2e]
    if: github.event_name == 'push' && startsWith(github.ref_name, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ouvrir la pull request au besoin, puis fusionner
        run: |
          git fetch origin main
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
            echo "Rien de nouveau par rapport à main."
            exit 0
          fi
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            # Demande, dans Settings → Actions → General, « Allow GitHub Actions to create and approve pull requests ».
            body=$(printf 'Livraison automatique de la branche `%s` après une CI verte.\n\n%s\n' "$GITHUB_REF_NAME" "$(git log --reverse --format='- %s' origin/main..HEAD)")
            if ! gh pr create --base main --head "$GITHUB_REF_NAME" --title "$(git log -1 --format=%s)" --body "$body"; then
              echo "::error::La CI n'a pas le droit d'ouvrir une pull request. Cochez Settings → Actions → General → « Allow GitHub Actions to create and approve pull requests », ou ouvrez la pull request à la main puis relancez cette tâche."
              exit 1
            fi
            pr=$(gh pr list --head "$GITHUB_REF_NAME" --base main --state open --json number --jq '.[0].number')
          fi
          if gh pr view "$pr" --json labels --jq '.labels[].name' | grep -qx "hold"; then
            echo "Étiquette « hold » sur la pull request #$pr : fusion suspendue."
            exit 0
          fi
          # Seul le commit qui vient d'être vérifié peut être fusionné.
          gh pr merge "$pr" --merge --match-head-commit "$GITHUB_SHA"
          # Une fusion faite avec le jeton de la CI ne relance pas de workflow sur main : la version se publie ici.
          git fetch origin main
          .github/scripts/release.sh origin/main

  release:
    name: Publication de la version
    # Fusion faite à la main (ou push direct) : la version du package.json est publiée si elle est nouvelle.
    needs: [checks, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Étiquette et release GitHub si la version est nouvelle
        run: .github/scripts/release.sh "$GITHUB_SHA"

  dependances:
    name: Fusion des mises à jour mineures
    needs: [checks, e2e]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      # Une version majeure peut casser un comportement que les tests ne couvrent pas : elle attend une relecture.
      - name: Fusionner sauf version majeure ou étiquette « hold »
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          if gh pr view "$PR_URL" --json labels --jq '.labels[].name' | grep -qx "hold"; then
            echo "Étiquette « hold » : fusion suspendue."
            exit 0
          fi
          gh pr merge "$PR_URL" --squash --match-head-commit "${{ github.event.pull_request.head.sha }}"
